function dayCard(){
  if(cur!==today().slice(0,7))return"";
  var td=today(),n=new Date(),p=cur.split("-"),dim=new Date(+p[0],+p[1],0).getDate(),left=dim-n.getDate()+1;
  var by={},cnt=0,big=0,first=td,mo=0;

  var sp=by[td]||0,auto=Math.max(0,Math.round((bal().m+sp)/left)),L=DAY>0?DAY:auto,r=L-sp,streak=0;
  if(L>0){for(var i=0;i<400;i++){var k=ds(new Date(n.getFullYear(),n.getMonth(),n.getDate()-i));if(k<first)break;if((by[k]||0)<=L)streak++;else break}}
  var days=[],mx=1;
  for(var j=6;j>=0;j--){var d2=new Date(n.getFullYear(),n.getMonth(),n.getDate()-j),k2=ds(d2),v=by[k2]||0;if(v>mx)mx=v;days.push({k:k2,v:v,l:d2.toLocaleDateString("ru-RU",{weekday:"short"})})}
  var wk=days.map(function(x){return '<div'+(x.k===td?' class="t"':'')+'><i style="height:'+(Math.round(x.v/mx*44)+4)+'px'+(L>0&&x.v>L?';background:var(--out)':'')+'"></i>'+esc(x.l)+'</div>'}).join("");
  return '<div class="card"><h2>Сегодня</h2><div class="td"><div><small>Потрачено</small><strong class="out">'+fmt(sp)+'</strong></div><div><small>Лимит на день</small><strong>'+(L?fmt(L):"—")+'</strong></div><div><small>Осталось</small><strong class="'+(r<0?"out":"in")+'">'+(L?(r<0?"−":"")+fmt(Math.abs(r)):"—")+'</strong></div></div>'
   +'<div class="bar"><i style="width:'+Math.min(100,L?sp/L*100:0)+'%;background:'+(r<0?"var(--out)":"var(--in)")+'"></i></div>'
   +'<div class="msg">'+(DAY>0?"Твой лимит.":"Лимит посчитан сам: остаток на счету ÷ дней до конца месяца ("+left+").")+' <button class="x" id="daybtn" style="color:var(--ac);padding:0">Задать свой</button></div>'
   +'<div class="wk">'+wk+'</div>'
   +'<div class="chips"><span>🔥 '+streak+' дн. в рамках лимита</span><span>📊 в среднем '+fmt(Math.round(mo/n.getDate()))+' в день</span><span>🧾 покупок: '+cnt+'</span>'+(big?'<span>💸 самая большая '+fmt(big)+'</span>':"")+'</div></div>';
}

}
